name: Test & Deploy

on:
  push:
    branches: [main]
  # PR 에서도 테스트가 돌아야 머지 전에 회귀를 잡을 수 있습니다.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 여러 배포가 겹치지 않도록 하되, 진행 중인 배포는 취소하지 않습니다.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 단위 테스트 (계산 엔진)
        run: node --test tests/calc-engine.test.mjs

      - name: 정적 파일 무결성 검사
        run: node scripts/verify-assets.mjs

      # public/ 을 고치고 dist/ 를 다시 빌드하지 않으면 배포본이 낡은 채로 남습니다.
      # 빌드를 다시 돌려 커밋된 결과물과 다르면 실패시킵니다.
      - name: 단일 파일 빌드 동기화 검사
        run: |
          node scripts/build-standalone.mjs
          node scripts/build-artifact.mjs
          if ! git diff --exit-code -- dist artifact; then
            echo "::error::dist/ 또는 artifact/ 가 public/ 과 어긋납니다. 'npm run build' 후 커밋하세요."
            exit 1
          fi

  deploy:
    name: Pages 배포
    needs: test
    # 배포는 main 브랜치 푸시(또는 수동 실행)에서만 수행합니다.
    # PR 에서는 테스트만 돌고 배포는 건너뜁니다.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - id: deployment
        uses: actions/deploy-pages@v4
