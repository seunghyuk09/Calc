name: Test & Deploy

on:
  push:
    branches: [main]
  # PR 에서도 테스트가 돌아야 머지 전에 회귀를 잡을 수 있습니다.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 여러 배포가 겹치지 않도록 하되, 진행 중인 배포는 취소하지 않습니다.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 브라우저가 필요 없는 빠른 검사. 문제가 있으면 몇 초 안에 알 수 있습니다.
  test:
    name: 빠른 검사
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # package.json 의 test:unit 을 그대로 씁니다.
      # 파일 목록을 여기에 또 적으면 테스트를 추가할 때마다 어긋납니다.
      # 실제로 today/prefs/calendar 테스트가 CI 에서 빠진 채로 돌고 있었습니다.
      - name: 단위 테스트
        run: npm run test:unit

      - name: 정적 파일 무결성 검사
        run: node scripts/verify-assets.mjs

      # public/ 을 고치고 dist/ 를 다시 빌드하지 않으면 배포본이 낡은 채로 남습니다.
      # 빌드를 다시 돌려 커밋된 결과물과 다르면 실패시킵니다.
      - name: 단일 파일 빌드 동기화 검사
        run: |
          node scripts/build-standalone.mjs
          node scripts/build-artifact.mjs
          if ! git diff --exit-code -- dist artifact; then
            echo "::error::dist/ 또는 artifact/ 가 public/ 과 어긋납니다. 'npm run build' 후 커밋하세요."
            exit 1
          fi

  # 실제 브라우저로 화면과 조작을 검증합니다. 위 검사가 못 잡는 UI 회귀를 잡습니다.
  e2e:
    name: E2E (실제 브라우저)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # 브라우저 내려받기는 느리므로 Playwright 버전이 같으면 캐시를 재사용합니다.
      - name: Playwright 브라우저 캐시
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Playwright 브라우저 설치
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # 캐시가 적중해도 시스템 라이브러리는 러너 이미지에 따라 없을 수 있어 별도로 맞춥니다.
      - name: 브라우저 시스템 의존성 확인
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # 테스트가 자체 정적 서버를 띄우므로 별도로 서버를 실행할 필요가 없습니다.
      - name: E2E — 웹 서버 모드
        run: npm run test:e2e

      - name: E2E — 단일 파일 file:// 모드
        run: npm run test:standalone

      # 실패했을 때 무엇이 어떻게 보였는지 확인할 수 있도록 스크린샷을 남깁니다.
      - name: 실패 시 스크린샷 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: test-results/*.png
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Pages 배포
    # UI 가 깨진 상태로는 배포하지 않습니다.
    needs: [test, e2e]
    # 배포는 main 브랜치 푸시(또는 수동 실행)에서만 수행합니다.
    # PR 에서는 테스트만 돌고 배포는 건너뜁니다.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 앱이 '내가 어느 커밋에서 나왔는지' 알아야 업데이트 확인을 할 수 있습니다.
      - name: 빌드 커밋 찍기
        run: node scripts/stamp-build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - id: deployment
        uses: actions/deploy-pages@v4
