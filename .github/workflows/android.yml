name: Android 앱 빌드

# 언제 도는가
#  - PR: 안드로이드 빌드가 깨지지 않았는지 머지 전에 확인합니다.
#        (개발 컨테이너에서는 Android SDK 를 받을 수 없어 CI 가 유일한 검증 수단입니다)
#  - main 에 푸시: 설치해 볼 수 있는 디버그 APK 를 만들어 Actions 아티팩트로 올립니다.
#  - v 로 시작하는 태그 푸시 (예: v1.0.0): Play 스토어 업로드용 서명된 AAB 를 만듭니다.
#  - 수동 실행도 가능합니다.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# GitHub 릴리스를 만들려면 contents: write 가 필요합니다.
# 릴리스 자산은 Actions 아티팩트와 달리 로그인 없이 직접 URL 로 받을 수 있고,
# GitHub 모바일 앱에서는 아티팩트를 아예 받을 수 없어서 릴리스가 유일한 실용적 배포 경로입니다.
permissions:
  contents: write

jobs:
  build:
    name: APK / AAB 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Capacitor 8 은 JDK 17 이상을 요구합니다. 21 을 씁니다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # android-actions/setup-android@v3 는 쓰지 않습니다.
      # 이미 폐기된 'tools' 패키지를 설치하려다 "Failed to find package 'tools'" 로 실패합니다.
      # ubuntu-latest 러너에는 Android SDK 가 이미 설치돼 있으므로 필요한 것만 직접 준비합니다.
      - name: Android SDK 준비
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager 를 찾지 못했습니다. 러너 이미지가 바뀌었는지 확인하세요."
            exit 1
          fi
          echo "sdkmanager: $SDKMANAGER"
          # 라이선스 동의는 이 명령이 비정상 종료해도 무시합니다 (이미 동의돼 있으면 그렇습니다)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # 플랫폼은 필수입니다. 없으면 빌드가 진행되지 않습니다.
          "$SDKMANAGER" "platforms;android-36" "platform-tools"
          # build-tools 는 AGP 가 필요 시 스스로 내려받으므로 실패해도 진행합니다.
          "$SDKMANAGER" "build-tools;36.0.0" || echo "::notice::build-tools 36.0.0 설치를 건너뜁니다 (AGP 가 처리)"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: 의존성 설치
        run: npm ci

      # public/ 의 웹 자산을 안드로이드 프로젝트로 복사합니다.
      - name: 웹 자산 동기화
        run: npx cap sync android

      # 버전은 태그에서 뽑습니다. versionCode 는 실행 번호라 항상 증가합니다.
      # (Play 는 같은 versionCode 재업로드를 거부합니다)
      - name: 버전 결정
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF#refs/tags/v}"
          else
            NAME="0.0.0-dev"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "::notice::versionName=$NAME versionCode=${GITHUB_RUN_NUMBER}"

      # --- 디버그 APK: 누구나 바로 설치해 볼 수 있는 빌드 ---
      - name: 디버그 APK 빌드
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleDebug \
            -PappVersionCode=${{ steps.ver.outputs.code }} \
            -PappVersionName=${{ steps.ver.outputs.name }}

      # 디버그 APK 가 저장소에 고정한 키로 서명됐는지 확인합니다.
      # AGP 가 ~/.android/debug.keystore 를 새로 만들어 쓰면 빌드마다 서명이 달라지고,
      # 이미 깔린 앱을 덮어쓸 수 없게 됩니다(설치 실패). 그 회귀를 여기서 잡습니다.
      # keytool -printcert -jarfile 은 v1(JAR) 서명만 읽어서 쓸 수 없습니다.
      # minSdk 24 이상이면 AGP 가 v1 을 끄고 v2 만 넣으므로 apksigner 를 써야 합니다.
      - name: 디버그 APK 서명 검증
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner 를 찾지 못했습니다. build-tools 설치를 확인하세요."
            exit 1
          fi
          norm() { tr -d ': ' | tr 'A-F' 'a-f'; }
          WANT=$(keytool -list -keystore android/app/debug.keystore \
                   -storepass android -alias androiddebugkey \
                 | grep -o '[0-9A-F][0-9A-F]\(:[0-9A-F][0-9A-F]\)\{31\}' | norm)
          GOT=$("$APKSIGNER" verify --print-certs "$APK" \
                 | grep -i 'certificate SHA-256 digest' | head -1 | awk '{print $NF}' | norm)
          echo "기대 지문: $WANT"
          echo "실제 지문: $GOT"
          if [ -z "$WANT" ] || [ "$WANT" != "$GOT" ]; then
            echo "::error::디버그 APK 서명이 저장소의 debug.keystore 와 다릅니다."
            exit 1
          fi
          echo "::notice::디버그 서명 확인 완료 ($GOT)"

      - name: 디버그 APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: dailykit-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # main 에 머지될 때마다 'nightly' 프리릴리스를 갈아끼웁니다.
      # 주소가 고정이라 폰 브라우저에서 로그인 없이 바로 받아 설치할 수 있습니다.
      # PR 에서는 돌지 않습니다 (포크 PR 의 토큰은 어차피 읽기 전용입니다).
      - name: 디버그 APK 를 nightly 릴리스로 공개
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::디버그 APK 를 찾지 못했습니다."
            exit 1
          fi
          cp "$APK" dailykit-debug.apk
          # 릴리스 설명은 파일로 넘깁니다. --notes 에 여러 줄을 직접 쓰면 YAML 이 깨집니다.
          cat > release-notes.md <<NOTES
          main 브랜치 최신 커밋(\`${GITHUB_SHA:0:7}\`)으로 만든 **디버그 빌드** 입니다.
          Play 스토어 정식 키가 아닌 공개된 디버그 키로 서명돼 있습니다.

          설치하려면 받은 브라우저에 '출처를 알 수 없는 앱 설치' 를 허용해야 합니다.
          One UI 6.1 이상이라면 설정 > 보안 및 개인정보 보호 > 자동 차단(Auto Blocker) 도 꺼야 합니다.
          Play 스토어 정식 버전이 아니며, main 에 커밋될 때마다 이 파일이 교체됩니다.

          설치 없이 웹으로 바로 쓰실 수도 있습니다: https://seunghyuk09.github.io/Calc/
          NOTES
          # 태그를 옮길 방법이 없어 기존 nightly 를 지우고 현재 커밋에 다시 만듭니다.
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dailykit-debug.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "데일리킷 최신 개발 빌드 (nightly)" \
            --notes-file release-notes.md
          echo "::notice::https://github.com/$GITHUB_REPOSITORY/releases/download/nightly/dailykit-debug.apk"

      # --- 릴리스 AAB: 태그를 밀었고 서명 비밀값이 등록돼 있을 때만 ---
      # 비밀값이 없으면 이 단계는 건너뛰므로, 설정 전에도 워크플로가 실패하지 않습니다.
      - name: 서명 키 준비
        id: signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANDROID_KEYSTORE_BASE64 시크릿이 없어 릴리스 AAB 빌드를 건너뜁니다."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 릴리스 AAB 빌드 (서명)
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon bundleRelease \
            -PappVersionCode=${{ steps.ver.outputs.code }} \
            -PappVersionName=${{ steps.ver.outputs.name }} \
            -Pandroid.injected.signing.store.file="$PWD/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: 릴리스 AAB 업로드
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dailykit-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 90

      # 태그 릴리스 페이지에 AAB 를 붙여 Play Console 에 바로 올릴 수 있게 합니다.
      # AAB 는 기기에 직접 설치할 수 없습니다. Play Console 업로드 전용입니다.
      - name: 태그 릴리스에 AAB 첨부
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -1)
          if [ -z "$AAB" ]; then
            echo "::error::릴리스 AAB 를 찾지 못했습니다."
            exit 1
          fi
          cp "$AAB" "dailykit-$TAG.aab"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "dailykit-$TAG.aab" --clobber
          else
            gh release create "$TAG" "dailykit-$TAG.aab" \
              --title "데일리킷 $TAG" \
              --notes "Play Console 에 업로드할 AAB 입니다. 기기에 직접 설치할 수는 없습니다."
          fi

      # 서명 키는 러너에 남기지 않습니다.
      - name: 서명 키 삭제
        if: always()
        run: rm -f android/app/release.keystore
