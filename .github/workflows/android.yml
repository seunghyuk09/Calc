name: Android 앱 빌드

# 언제 도는가
#  - main 에 푸시: 설치해 볼 수 있는 디버그 APK 를 만들어 Actions 아티팩트로 올립니다.
#  - v 로 시작하는 태그 푸시 (예: v1.0.0): Play 스토어 업로드용 서명된 AAB 를 만듭니다.
#  - 수동 실행도 가능합니다.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: APK / AAB 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Capacitor 8 은 JDK 17 이상을 요구합니다. 21 을 씁니다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: 의존성 설치
        run: npm ci

      # public/ 의 웹 자산을 안드로이드 프로젝트로 복사합니다.
      - name: 웹 자산 동기화
        run: npx cap sync android

      # 버전은 태그에서 뽑습니다. versionCode 는 실행 번호라 항상 증가합니다.
      # (Play 는 같은 versionCode 재업로드를 거부합니다)
      - name: 버전 결정
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF#refs/tags/v}"
          else
            NAME="0.0.0-dev"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "::notice::versionName=$NAME versionCode=${GITHUB_RUN_NUMBER}"

      # --- 디버그 APK: 누구나 바로 설치해 볼 수 있는 빌드 ---
      - name: 디버그 APK 빌드
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleDebug \
            -PappVersionCode=${{ steps.ver.outputs.code }} \
            -PappVersionName=${{ steps.ver.outputs.name }}

      - name: 디버그 APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: dailykit-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # --- 릴리스 AAB: 태그를 밀었고 서명 비밀값이 등록돼 있을 때만 ---
      # 비밀값이 없으면 이 단계는 건너뛰므로, 설정 전에도 워크플로가 실패하지 않습니다.
      - name: 서명 키 준비
        id: signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANDROID_KEYSTORE_BASE64 시크릿이 없어 릴리스 AAB 빌드를 건너뜁니다."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 릴리스 AAB 빌드 (서명)
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon bundleRelease \
            -PappVersionCode=${{ steps.ver.outputs.code }} \
            -PappVersionName=${{ steps.ver.outputs.name }} \
            -Pandroid.injected.signing.store.file="$PWD/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: 릴리스 AAB 업로드
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dailykit-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 90

      # 서명 키는 러너에 남기지 않습니다.
      - name: 서명 키 삭제
        if: always()
        run: rm -f android/app/release.keystore
